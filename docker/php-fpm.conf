; Cloud Run overrides. Keeps FPM on loopback (nginx is the only client) and
; passes container environment variables through to workers so Laravel reads
; the runtime configuration injected by Cloud Run.

[www]
listen = 127.0.0.1:9000
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8

access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
